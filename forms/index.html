  <body>
    <h1>Pineapple form</h1>

      <div class="main">

          type="text"
          required
          autofocus
          id="fname"
          name="fname"
        /><br /><br />

        <label for="lname">Last name:</label>
        <input type="text" required id="lname" name="lname" /><br /><br />

        <label for="email">Email Address:</label>
        <input type="email" required id="email" name="email" /><br /><br />

        <h3>How many pineapples does it take to make a pineapple?</h3>

        <input type="radio" id="pineapple" name="pineapple" />
        <label for="pineapple">1</label><br />
        <input type="radio" id="pineapple" name="pineapple" />
        <label for="pineapple">5</label><br />
        <input type="radio" id="pineapple" name="pineapple" />
        <label for="pineapple">3</label><br />
        <input type="radio" id="pineapple" name="pineapple" />
        <label for="pineapple">10</label><br />

        <h3>Pineapple?</h3>

        <label for="chechbox">PinePine?</label><br />

        <label for="chechbox">I perfer mangos</label><br /><br /><br />

</html>
